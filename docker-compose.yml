services:
  ai-agent:
    build: .
    container_name: ai-agent
    stdin_open: true
    tty: true
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - DEFAULT_MODEL=${DEFAULT_MODEL}
      - STRICT_JSON_MODE=${STRICT_JSON_MODE}
    volumes:
      # Mount BOTH data and source code for development
      - ./data:/app/data
      - .:/app  # This allows live code editing from VS Code
    # Users will run python manually from VS Code terminal
    command: ["tail", "-f", "/dev/null"]  # Keeps container alive